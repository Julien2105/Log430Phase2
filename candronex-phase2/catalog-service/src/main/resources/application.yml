server:
  port: 8085
  shutdown: graceful

spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog_db}
    username: ${DB_USER:candronex}
    password: ${DB_PASSWORD:candronex}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8

candronex:
  security:
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/realms/candronex/protocol/openid-connect/certs}
    issuer: ${JWT_ISSUER:http://localhost:8080/realms/candronex}
    audience: ${JWT_AUDIENCE:candronex-api}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
