server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: inventory-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${DB_USER:candronex}
    password: ${DB_PASSWORD:candronex}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

candronex:
  security:
    # Validation du JWT émis par Keycloak : signature (JWKS), expiration, issuer, audience, claim clientId.
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/realms/candronex/protocol/openid-connect/certs}
    issuer: ${JWT_ISSUER:http://localhost:8080/realms/candronex}
    audience: ${JWT_AUDIENCE:candronex-api}
  inventory:
    # Clients techniques autorisés à enregistrer un service au nom d'un client (reprise sans jeton client).
    trusted-clients: ${INVENTORY_TRUSTED_CLIENTS:slice-service}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
