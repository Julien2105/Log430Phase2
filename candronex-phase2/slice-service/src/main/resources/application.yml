server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: slice-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slice_db}
    username: ${DB_USER:candronex}
    password: ${DB_PASSWORD:candronex}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

candronex:
  security:
    # Validation du JWT émis par Keycloak : signature (JWKS), expiration, issuer, audience, claim clientId.
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/realms/candronex/protocol/openid-connect/certs}
    issuer: ${JWT_ISSUER:http://localhost:8080/realms/candronex}
    audience: ${JWT_AUDIENCE:candronex-api}
  mock:
    # MockOpen5GSAdapter : latence simulée et taux d'échec (pourcentage, 0 à 100).
    latency-min-ms: ${MOCK_LATENCY_MIN_MS:300}
    latency-max-ms: ${MOCK_LATENCY_MAX_MS:1500}
    failure-rate: ${MOCK_FAILURE_RATE:0}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8084}
    connect-timeout-ms: 500
    read-timeout-ms: 3000
    token-url: ${KEYCLOAK_TOKEN_URL:http://localhost:8080/realms/candronex/protocol/openid-connect/token}
    client-id: ${SLICE_CLIENT_ID:slice-service}
    client-secret: ${SLICE_CLIENT_SECRET:slice-service-secret}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
