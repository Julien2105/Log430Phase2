openapi: 3.0.3
info:
  title: CanDroneX - API publique (KrakenD)
  version: 2.0.0
  description: 'Contrat public exposé par la passerelle (http://localhost:8000). Routes internes non publiées. Authorization:
    Bearer <JWT> (Keycloak); Idempotency-Key et X-Correlation-Id transmis.'
servers:
- url: http://localhost:8000
  description: Docker Compose
security:
- bearerAuth: []
paths:
  /api/v1/drones:
    post:
      tags:
      - Drones
      operationId: registerDrone
      summary: Enregistrer un drone (UC-02)
      parameters:
      - &id001
        name: X-Correlation-Id
        in: header
        required: false
        schema:
          type: string
        description: Identifiant de corrélation propagé; généré s'il est absent.
      responses:
        '201':
          description: Créé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drone'
        '200':
          description: Rejeu identique.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drone'
        '400': &id003
          description: Requête invalide.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401': &id002
          description: JWT absent ou invalide (signature, expiration, issuer, audience candronex-api, clientId).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409': &id004
          description: 'Conflit : même clé ou même identifiant avec un contenu différent.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DroneRequest'
    get:
      tags:
      - Drones
      operationId: listDrones
      summary: Lister les drones du client
      parameters:
      - *id001
      responses:
        '200':
          description: Drones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Drone'
        '401': *id002
  /api/v1/drones/{droneId}:
    get:
      tags:
      - Drones
      operationId: getDrone
      summary: Consulter un drone
      parameters:
      - *id001
      - name: droneId
        in: path
        required: true
        schema:
          type: string
        description: ''
      responses:
        '200':
          description: Drone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Drone'
        '401': *id002
        '404': &id005
          description: Ressource inexistante ou appartenant à un autre client.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/service-offerings:
    get:
      tags:
      - Catalogue
      operationId: listOfferings
      summary: Lister les offres
      parameters:
      - *id001
      responses:
        '200':
          description: Offres.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceOffering'
        '401': *id002
  /api/v1/service-offerings/{serviceOfferingId}:
    get:
      tags:
      - Catalogue
      operationId: getOffering
      summary: Consulter une offre
      parameters:
      - *id001
      - name: serviceOfferingId
        in: path
        required: true
        schema:
          type: string
        description: ''
      responses:
        '200':
          description: Offre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOffering'
        '401': *id002
        '404':
          description: Offre inconnue.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/orders:
    post:
      tags:
      - Commandes
      operationId: createOrder
      summary: Créer une commande (UC-04)
      parameters:
      - *id001
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 128
        description: Même clé + même contenu = même commande (200); même clé + contenu différent = 409.
      responses:
        '201':
          description: Créée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '200':
          description: Rejeu identique.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400': *id003
        '401': *id002
        '404':
          description: Drone ou offre introuvable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409': *id004
        '503':
          description: Dépendance indisponible.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
    get:
      tags:
      - Commandes
      operationId: listOrders
      summary: Lister les commandes
      parameters:
      - *id001
      responses:
        '200':
          description: Commandes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401': *id002
  /api/v1/orders/{orderId}:
    get:
      tags:
      - Commandes
      operationId: getOrder
      summary: Consulter une commande et l'état de ses services
      parameters:
      - *id001
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ''
      responses:
        '200':
          description: Commande.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401': *id002
        '404': *id005
  /api/v1/services:
    get:
      tags:
      - Services
      operationId: listServices
      summary: Lister les services activés
      parameters:
      - *id001
      - name: droneId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Services.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceInstance'
        '401': *id002
  /api/v1/services/{serviceId}:
    get:
      tags:
      - Services
      operationId: getService
      summary: Consulter un service activé
      parameters:
      - *id001
      - name: serviceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ''
      responses:
        '200':
          description: Service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceInstance'
        '401': *id002
        '404': *id005
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Authorization: Bearer <JWT> émis par Keycloak (realm candronex). Validation : signature, expiration, issuer,
        audience candronex-api, clientId.'
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - code
      - correlationId
      properties:
        type:
          type: string
          example: https://candronex.example/problems/not-found
        title:
          type: string
        status:
          type: integer
          example: 404
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          example: NOT_FOUND
        correlationId:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    DroneRequest:
      type: object
      required:
      - droneId
      - imsi
      properties:
        droneId:
          type: string
          maxLength: 64
          example: DRN-0231
        imsi:
          type: string
          pattern: ^[0-9]{15}$
          example: '302720123456789'
        label:
          type: string
          maxLength: 200
    Drone:
      type: object
      properties:
        droneId:
          type: string
        label:
          type: string
        registeredAt:
          type: string
          format: date-time
      description: L'IMSI n'est jamais exposé.
    NetworkIdentity:
      type: object
      properties:
        droneId:
          type: string
        imsi:
          type: string
    Characteristic:
      type: object
      properties:
        name:
          type: string
          example: sst
        value:
          type: string
          example: '2'
    ServiceOffering:
      type: object
      properties:
        serviceOfferingId:
          type: string
          example: C2_URLLC
        name:
          type: string
        description:
          type: string
        serviceSpecification:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        serviceCharacteristics:
          type: array
          items:
            $ref: '#/components/schemas/Characteristic'
    OrderRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - action
            - droneId
            - serviceOfferingId
            properties:
              action:
                type: string
                enum:
                - ADD
              droneId:
                type: string
                example: DRN-0231
              serviceOfferingId:
                type: string
                example: C2_URLLC
    Order:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - ACCEPTED
          - IN_PROGRESS
          - ACTIVE
          - PARTIALLY_ACTIVE
          - FAILED
        acceptedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
            properties:
              lineId:
                type: string
                format: uuid
              action:
                type: string
              droneId:
                type: string
              state:
                type: string
                enum:
                - PENDING
                - ACTIVATING
                - ACTIVE
                - FAILED
              service:
                type: object
                properties:
                  serviceOfferingId:
                    type: string
                  serviceCharacteristic:
                    type: array
                    items:
                      $ref: '#/components/schemas/Characteristic'
                description: Caractéristiques copiées (snapshot) au moment de la commande.
    ServiceInstanceRequest:
      type: object
      required:
      - clientId
      - orderId
      - droneId
      - serviceOfferingId
      - state
      - activatedAt
      properties:
        clientId:
          type: string
        orderId:
          type: string
          format: uuid
        droneId:
          type: string
        serviceOfferingId:
          type: string
        state:
          type: string
          enum:
          - ACTIVE
        activatedAt:
          type: string
          format: date-time
    ServiceInstance:
      type: object
      properties:
        serviceId:
          type: string
        orderId:
          type: string
        droneId:
          type: string
        serviceOfferingId:
          type: string
        state:
          type: string
        activatedAt:
          type: string
          format: date-time
      description: Sans IMSI.
