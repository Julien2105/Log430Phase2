server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${DB_USER:candronex}
    password: ${DB_PASSWORD:candronex}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8

candronex:
  security:
    # Validation du JWT émis par Keycloak : signature (JWKS), expiration, issuer, audience, claim clientId.
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/realms/candronex/protocol/openid-connect/certs}
    issuer: ${JWT_ISSUER:http://localhost:8080/realms/candronex}
    audience: ${JWT_AUDIENCE:candronex-api}
  remote:
    drone:
      base-url: ${DRONE_SERVICE_URL:http://localhost:8081}
      connect-timeout-ms: 500
      read-timeout-ms: 1500
    catalog:
      base-url: ${CATALOG_SERVICE_URL:http://localhost:8085}
      connect-timeout-ms: 500
      read-timeout-ms: 1500
    slice:
      base-url: ${SLICE_SERVICE_URL:http://localhost:8083}
      connect-timeout-ms: 500
      read-timeout-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
